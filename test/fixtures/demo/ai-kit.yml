# Cấu hình ai-kit của dự án mẫu. Xem ../../docs/11-cau-hinh.md.
# Đường dẫn tính từ gốc dự án mẫu (fixture test). Khoá trùng mặc định vẫn ghi ra để dễ đọc.
version: 2
kitRef: v2

language: vi

project:
  name: Đơn hàng demo
  baseBranch: main
  remote: origin
  prTool: gh

agents: [claude]
guides: [CLAUDE.md, e2e/README.md]  # lớp kỹ thuật của dự án

spec:
  adapter: prd-fsd
  roots: [docs/features]
  status: { draft: Nháp, approved: Đã duyệt }
  plansDir: docs/plans
  wireframeWidth: 76
  prototype: true

stack:
  checks:
    - { name: cú pháp, run: 'for f in app/server.mjs e2e/*/*.mjs e2e/*/*/*.mjs; do node --check "$f" || exit 1; done' }
  traceability: { searchPaths: [app, e2e] }
  env: 'npm run app → http://127.0.0.1:4310'

# ── TAF ──────────────────────────────────────────────────────────────────────
testcases:
  dir: e2e/testcases
  labels: vi
  personas: e2e/testdata/personas.yml

scripts:
  dir: e2e/scripts
  ext: .spec.mjs
  guide: e2e/README.md
  allowedPaths:
    - e2e/scripts/**
    - e2e/pages/**
  forbid:
    - 'page\.locator\('
    - 'page\.getBy'
    - 'waitForTimeout\('
    - 'from ["'']@playwright/test'
  lint: for f in e2e/scripts/*/*.spec.mjs e2e/pages/*/*.mjs; do node --check "$f" || exit 1; done

run:
  command: npx playwright test --reporter=json,list {files}
  baseUrlEnv: E2E_BASE_URL             # playwright.config.mjs đọc biến này

trigger:
  codePaths: [app/**]

gate:
  blockedLabel: e2e-blocked

tracker:
  adapter: github
  labels: [bug, e2e, demo]
