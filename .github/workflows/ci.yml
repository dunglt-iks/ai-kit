name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Cài gói kit vào repo trống (như dự án cài từ git tag), kit init hai lần, rồi doctor
        run: |
          pkg="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          d="$RUNNER_TEMP/empty" && mkdir -p "$d" && cd "$d" && git init -q && npm init -y >/dev/null
          npm install -D --no-audit --no-fund "$RUNNER_TEMP/$pkg"
          npx --no kit init
          npx --no kit init
          test -f ai-kit.yml && test -f CLAUDE.md
          node -e 'const s=require("./.claude/settings.json"); if (!s.enabledPlugins["kit@ai-kit"]) process.exit(1)'
          npx --no kit doctor
