name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: setup.sh trên repo trống (cài kit một lệnh), chạy lại lần hai, rồi doctor
        run: |
          d="$RUNNER_TEMP/empty" && mkdir -p "$d" && cd "$d" && git init -q
          ln -s "$GITHUB_WORKSPACE" .ai-kit
          bash .ai-kit/setup.sh --yes
          bash .ai-kit/setup.sh --yes
          test -f ai-kit.yml && test -f .claude/commands/spec.md
          node .ai-kit/cli/bin/kit.mjs doctor
