# Ví dụ sống: repo dự án (examples/demo) cắm ai-kit vào CI của mình cho PR. Phần của dự án: checkout, cài, dựng
# app. Phần của kit: một bước actions/e2e (repo thật dùng `uses: dunglt-iks/ai-kit/actions/e2e@v2`).
# PR đụng examples/demo/** sẽ chạy.
name: Demo — E2E cho PR

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    paths: ["examples/demo/**"]

concurrency:
  group: demo-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # comment gate + kết quả
  issues: write          # nhãn chặn

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: examples/demo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # kit đọc commit của PR để lấy mã feature
      # ── Phần của dự án ──
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cài, dựng app
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          bash ci/app-up.sh
      # ── Điểm cắm ai-kit ──
      - uses: ./actions/e2e
        with:
          root: examples/demo
          scope: changed
          base-url: http://127.0.0.1:4310
          env: pr
          artifact: demo-pr-${{ github.event.pull_request.number }}
      # ── Phần của dự án ──
      - name: Tắt app
        if: always()
        run: bash ci/app-down.sh
